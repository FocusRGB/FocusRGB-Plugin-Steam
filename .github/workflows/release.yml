name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/FocusRgb.Plugin.Steam/**
      - LICENSE

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: 1
      PACKAGE_SUFFIX: ${{ github.event_name == 'push' && github.ref_name || format('dry-run-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRGB-Plugin-Steam.slnx
      - run: dotnet build FocusRGB-Plugin-Steam.slnx -c Release --no-restore --disable-build-servers
      - run: dotnet test --solution FocusRGB-Plugin-Steam.slnx -c Release --no-build
      - name: Assemble package
        shell: pwsh
        run: |
          dotnet publish src/FocusRgb.Plugin.Steam/FocusRgb.Plugin.Steam.csproj -c Release --no-build --no-self-contained -o build/package/steam
          Copy-Item src/FocusRgb.Plugin.Steam/focusrgb-plugin.json build/package/steam/
          Copy-Item LICENSE build/package/steam/
          $zip = "build/FocusRGB-Plugin-Steam-${{ env.PACKAGE_SUFFIX }}.zip"
          $manifest = "build/focusrgb-plugin.json"
          Compress-Archive build/package/steam/* $zip
          Copy-Item src/FocusRgb.Plugin.Steam/focusrgb-plugin.json $manifest
          $checksumLines = @($zip, $manifest) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          }
          $checksumPath = Join-Path $PWD build/SHA256SUMS
          [IO.File]::WriteAllText(
            $checksumPath, ($checksumLines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText($checksumPath).Contains("`r")) {
            throw "SHA256SUMS must use LF line endings."
          }
          if ((Get-Content build/SHA256SUMS).Count -ne 2) {
            throw "SHA256SUMS must contain the package and manifest hashes."
          }
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: FocusRGB-Plugin-Steam-${{ env.PACKAGE_SUFFIX }}
          path: |
            build/FocusRGB-Plugin-Steam-${{ env.PACKAGE_SUFFIX }}.zip
            build/focusrgb-plugin.json
            build/SHA256SUMS
          if-no-files-found: error
      - name: Stop build servers
        if: always()
        run: dotnet build-server shutdown

  publish:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FocusRGB-Plugin-Steam-${{ github.ref_name }}
          path: build
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/FocusRGB-Plugin-Steam-${{ github.ref_name }}.zip
            build/focusrgb-plugin.json
            build/SHA256SUMS
          generate_release_notes: true
