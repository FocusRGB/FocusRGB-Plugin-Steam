name: Branch policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          case "$BASE" in
            main)
              if [ "$HEAD" != "develop" ] || [ "$HEAD_REPO" != "$REPO" ]; then
                echo "::error::main accepts pull requests only from develop in $REPO (got $HEAD_REPO:$HEAD)."
                exit 1
              fi
              ;;
            develop)
              case "$HEAD" in
                feature/*|slice/*|fix/*|chore/*|docs/*|dependabot/*) ;;
                *)
                  echo "::error::develop accepts pull requests only from feature/, slice/, fix/, chore/, docs/, or dependabot/ branches (got $HEAD)."
                  exit 1
                  ;;
              esac
              ;;
          esac
          echo "Pull request $HEAD -> $BASE is allowed."
